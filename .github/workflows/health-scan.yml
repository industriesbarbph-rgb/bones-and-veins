name: Bones & Veins Health Scan
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bones-veins-health
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/scan-health.mjs
      - run: node scripts/build-ai-package.mjs
      - name: Commit reports without requesting a site deploy
        run: |
          git config user.name "bones-veins"
          git config user.email "actions@github.com"
          git add data/health.json data/reliability.json data/ledger.json data/ai-diagnostic-package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Bones & Veins health data [skip netlify]"
          git push
