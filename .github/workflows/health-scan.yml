name: Bones & Veins Health Scan
on:
  schedule:
    - cron: "17 * * * *"
  push:
    paths:
      - "registry.json"
      - "scripts/scan-health.mjs"
      - "scripts/build-cure-queue.mjs"
      - "scripts/build-ai-package.mjs"
      - "scripts/notify-ntfy.mjs"
      - ".github/workflows/health-scan.yml"
  workflow_dispatch:
    inputs:
      send_test_alert:
        description: "Send a one-time ntfy connection test"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: bones-veins-health
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Preserve previous health snapshot
        run: cp data/health.json /tmp/health-before.json 2>/dev/null || echo '{"properties":[]}' > /tmp/health-before.json
      - run: node scripts/scan-health.mjs
      - run: node scripts/build-cure-queue.mjs
      - run: node scripts/build-ai-package.mjs
      - name: Send ntfy alerts for meaningful health changes
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: https://ntfy.sh
          NTFY_CONSOLE_URL: https://seohealth.barbph.com/
          PREV_HEALTH_PATH: /tmp/health-before.json
          NTFY_TEST: ${{ inputs.send_test_alert }}
        run: node scripts/notify-ntfy.mjs
      - name: Commit reports without requesting a site deploy
        run: |
          git config user.name "bones-veins"
          git config user.email "actions@github.com"
          git add data/health.json data/reliability.json data/ledger.json data/cure-candidates.json data/ai-diagnostic-package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Bones & Veins health data [skip netlify]"
          git push
