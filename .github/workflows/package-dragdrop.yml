name: Bones & Veins Drag Drop Package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'cure-queue.js'
      - 'styles.css'
      - 'privacy.html'
      - 'robots.txt'
      - 'registry.json'
      - 'config/runtime.json'
      - 'data/**'
      - 'scripts/preflight.mjs'
      - '.github/workflows/package-dragdrop.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply final UI truthfulness fixes
        shell: python
        run: |
          from pathlib import Path

          app = Path('app.js')
          text = app.read_text()

          old = """  const dominant = s.fault ? 'FAULT' : s.warning ? 'WARNING' : (s.healthy || s.thriving) ? 'HEALTHY' : 'OBSERVING';
          $('#overallHealth').textContent = dominant;
          setVeins(dominant.toLowerCase());
        }

        function setVeins(state) {
          document.querySelectorAll('.vein').forEach(v => {
            v.className.baseVal = 'vein ' + (state === 'healthy' ? '' : state);
          });
        }
        """
          new = """  const dominant = s.fault ? 'FAULT' : s.warning ? 'WARNING' : (s.healthy || s.thriving) ? 'HEALTHY' : 'OBSERVING';
          $('#overallHealth').textContent = dominant;
          const systemHealthState = $('#systemHealthState');
          if (systemHealthState) systemHealthState.textContent = dominant;
          setVeins(dominant.toLowerCase());
        }

        function setVeins(state) {
          const stage = document.querySelector('.organism-stage');
          if (!stage) return;
          stage.dataset.healthState = state;
        }
        """
          if old in text:
              text = text.replace(old, new)

          old_ledger = """function renderLedger() {
          const e = ledger.entries || [];
          $('#ledgerCount').textContent = `${e.length} ENTRIES`;
          $('#ledger').innerHTML = e.length ? '' : `<div class=\"tiny\">Ledger is empty until the first scanner run.</div>`;
          e.slice().reverse().slice(0, 100).forEach(x => {
            const d = document.createElement('div');
            d.className = 'ledger-row';
            d.innerHTML = `<time>${esc(x.at || '')}</time><br>${esc(x.type || 'EVENT')} — ${esc(x.message || '')}`;
            $('#ledger').appendChild(d);
          });
        }
        """
          new_ledger = """function renderLedger() {
          const e = ledger.entries || [];
          $('#ledgerCount').textContent = `${e.length} ENTRIES`;
          $('#ledger').innerHTML = e.length ? '' : `<div class=\"tiny\">Ledger is empty until the first scanner run.</div>`;
          e.slice().reverse().slice(0, 100).forEach(x => {
            const d = document.createElement('div');
            d.className = 'ledger-row';
            d.innerHTML = `<time>${esc(x.at || '')}</time><br>${esc(x.type || 'EVENT')} — ${esc(x.message || '')}`;
            $('#ledger').appendChild(d);
          });

          const feed = $('#activityFeed');
          if (feed) {
            const recent = e.slice().reverse().slice(0, 4);
            feed.innerHTML = recent.length ? '' : '<p><time>--:--</time><i></i> Waiting for the first machine-ledger event.</p>';
            recent.forEach(x => {
              const p = document.createElement('p');
              const stamp = x.at ? new Date(x.at) : null;
              const time = stamp && !Number.isNaN(stamp.valueOf())
                ? stamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                : '--:--';
              p.innerHTML = `<time>${esc(time)}</time><i></i> ${esc(x.message || x.type || 'Machine event')}`;
              feed.appendChild(p);
            });
          }
        }
        """
          if old_ledger in text:
              text = text.replace(old_ledger, new_ledger)

          text = text.replace("lines.push('BONES & VEINS — BarbPH SEO Health');", "lines.push('BONES & VEINS - BarbPH SEO Health');")
          app.write_text(text)

          index = Path('index.html')
          html = index.read_text()
          html = html.replace(
              '<span>OVERALL STATE</span><strong>OBSERVING</strong><p>Scanner safety gate active.',
              '<span>OVERALL STATE</span><strong id="systemHealthState">OBSERVING</strong><p>Scanner safety gate active.'
          )
          index.write_text(html)

          css = Path('styles.css')
          style = css.read_text()
          marker = '/* organism health-state colors */'
          if marker not in style:
              style += """

        /* organism health-state colors */
        .organism-stage[data-health-state=\"warning\"] .vein-flow{stroke:var(--amber)}
        .organism-stage[data-health-state=\"warning\"] .vein-capillary{stroke:#a99139}
        .organism-stage[data-health-state=\"fault\"] .vein-flow{stroke:var(--red)}
        .organism-stage[data-health-state=\"fault\"] .vein-capillary{stroke:#8e4545}
        .organism-stage[data-health-state=\"observing\"] .vein-flow{stroke:#73b586}
        .organism-stage[data-health-state=\"observing\"] .vein-capillary{stroke:#4b7c59}
        """
          css.write_text(style)

      - name: Validate polished source
        run: |
          node --check app.js
          node --check cure-queue.js
          node scripts/preflight.mjs
          grep -q 'id="systemHealthState"' index.html
          grep -q 'stage.dataset.healthState' app.js
          grep -q "const feed = \$('#activityFeed'\)" app.js
          grep -q 'organism health-state colors' styles.css

      - name: Commit polished source
        run: |
          if git diff --quiet -- app.js index.html styles.css; then
            echo 'Source already polished.'
          else
            git config user.name 'bones-veins-machine'
            git config user.email 'actions@users.noreply.github.com'
            git add app.js index.html styles.css
            git commit -m 'Fix live dashboard state and activity wiring [skip netlify]'
            git push
          fi

      - name: Build static drag-and-drop folder
        shell: bash
        run: |
          set -euo pipefail
          rm -rf deploy BONES-AND-VEINS-DRAG-DROP.zip
          mkdir -p deploy/config deploy/data

          cp index.html app.js cure-queue.js styles.css privacy.html robots.txt registry.json deploy/
          cp config/runtime.json deploy/config/runtime.json
          cp data/health.json data/ledger.json data/reliability.json data/cure-candidates.json data/ai-reports.json data/google-search-console.json deploy/data/

          cat > deploy/_headers <<'EOF'
          /*
            X-Robots-Tag: noindex, nofollow, noarchive
            X-Content-Type-Options: nosniff
            Referrer-Policy: no-referrer
            Permissions-Policy: camera=(), microphone=(), geolocation=()
            Cross-Origin-Opener-Policy: same-origin-allow-popups
            Content-Security-Policy: default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' https://accounts.google.com; img-src 'self' data:; connect-src 'self' https://raw.githubusercontent.com https://www.googleapis.com https://searchconsole.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; base-uri 'self'; form-action 'self'; object-src 'none'

          /*.html
            Cache-Control: no-cache

          /registry.json
            Cache-Control: no-store

          /config/*
            Cache-Control: no-store

          /data/*
            Cache-Control: no-store
          EOF

          node --check deploy/app.js
          node --check deploy/cure-queue.js
          node -e "for (const p of ['deploy/registry.json','deploy/config/runtime.json','deploy/data/health.json','deploy/data/ledger.json','deploy/data/reliability.json','deploy/data/cure-candidates.json','deploy/data/ai-reports.json','deploy/data/google-search-console.json']) JSON.parse(require('fs').readFileSync(p,'utf8'));"

          grep -q 'cure-queue.js' deploy/index.html
          grep -q 'app.js' deploy/index.html
          grep -q 'styles.css' deploy/index.html
          grep -q 'id="systemHealthState"' deploy/index.html
          grep -q 'stage.dataset.healthState' deploy/app.js
          grep -q 'webmasters.readonly' deploy/config/runtime.json
          grep -q 'cureQueueDataUrl' deploy/config/runtime.json
          grep -q 'CURE APPROVAL:.*LOCKED' deploy/cure-queue.js
          grep -q 'PUBLISH APPROVAL:.*LOCKED' deploy/cure-queue.js
          test "$(jq '.properties|length' deploy/registry.json)" = '20'
          test "$(jq '[.tickets[]|select(.cureApproval==true)]|length' deploy/data/cure-candidates.json)" = '0'
          test "$(jq '[.tickets[]|select(.publishApproval==true)]|length' deploy/data/cure-candidates.json)" = '0'

          if grep -R -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[0-9A-Za-z]{30,}|sk-[0-9A-Za-z_-]{20,}' deploy; then
            echo 'Secret-like material detected in deployment folder' >&2
            exit 1
          fi

          (cd deploy && zip -r ../BONES-AND-VEINS-DRAG-DROP.zip .)
          test "$(unzip -Z1 BONES-AND-VEINS-DRAG-DROP.zip | head -1)" != 'deploy/'
          unzip -Z1 BONES-AND-VEINS-DRAG-DROP.zip | grep -qx 'index.html'
          unzip -Z1 BONES-AND-VEINS-DRAG-DROP.zip | grep -qx '_headers'

      - name: Upload drag-and-drop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BONES-AND-VEINS-DRAG-DROP
          path: BONES-AND-VEINS-DRAG-DROP.zip
          if-no-files-found: error
          retention-days: 30
