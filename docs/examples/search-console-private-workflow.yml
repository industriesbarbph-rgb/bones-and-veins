name: Google Search Console Sync
on:
  schedule:
    - cron: "37 22 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bones-veins-google
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/search-console.mjs
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      - run: node scripts/build-ai-package.mjs
      - name: Commit Google reports without requesting a site deploy
        run: |
          git config user.name "bones-veins"
          git config user.email "actions@github.com"
          git add data/google-search-console.json data/ai-diagnostic-package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update Search Console data [skip netlify]"
          git push
